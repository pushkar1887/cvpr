# Run matrix (plan.md Part B). `python -m medprune.run_eval` expands each block into runs
# (model x dataset x method x budget x seed). Run IDs do not include the experiment, so a run listed by several
# experiments (e.g. E1's runs reused by E3) is computed once. E9 (latency) is not a run_eval run.

rates_s_per_q:  # T4x2 fp16, batch 1. "m" = measured (Stage 3-4 run files), "p" = predicted from the fitted cost model
  # s/q = 1.6 ms x visual tokens + ~80 ms x generated tokens (R2 0.98-0.99 on 18.5k questions; plan.md §C4)
  lingshu7b:
    {slake_en: 1.07, slake_zh: 1.10, rin_anat_mc: 0.35, rin_abn_closed: 0.30, omni_anat: 0.50, omni_panel: 0.80,
     natural: 0.72, slake: 1.10, rin: 0.35, omni: 0.80,
     slake_en_s224: 0.65, natural_s224: 0.30, rin_anat_mc_s448: 0.66, rin_open: 0.60,
     text_only: {slake: 0.66, rin: 0.23, omni: 0.25, natural: 0.30, rin_open: 0.45}}
    # m: slake_en, rin_anat_mc, text_only slake/rin. p: the rest (slake_zh +3% for longer CJK answers; resized
    # datasets from the cost model at 64 / 256 visual tokens).
  qwen3vl8b:
    {slake_en: 0.98, slake_zh: 1.00, rin_anat_mc: 0.28, rin_abn_closed: 0.26, omni_anat: 0.43, omni_panel: 0.68,
     natural: 0.58, slake: 1.00, rin: 0.28, omni: 0.68,
     slake_en_s224: 0.65, natural_s224: 0.25, rin_anat_mc_s448: 0.49, rin_open: 0.55,
     text_only: {slake: 0.35, rin: 0.18, omni: 0.20, natural: 0.25, rin_open: 0.40}}
    # m: slake_en, rin_anat_mc, text_only slake/rin. p: the rest.
  huatuo7b:
    {slake: 1.15, rin: 1.15, omni: 1.15, natural: 1.15, text_only: 0.30}
    # p: always 576 tokens (expand2square 336, 1D RoPE); unmeasured until Stage 7.

groups:
  K: [slake_en, rin_anat_mc]
  S1: [slake_en, rin_anat_mc, rin_abn_closed]
  S2: [slake_zh]
  S3: [omni_anat]
  P: [omni_panel]
  N: [natural]

blocks:
  # Stage 3 — E0: validation (Qwen3-VL: run with --limit 50; the run continues in E3)
  - {exp: E0, tier: P0, account: A, model: lingshu7b, groups: [slake_en], methods: [full]}
  - {exp: E0, tier: P0, account: B, model: qwen3vl8b, groups: [slake_en], methods: [full]}
  - {exp: E0, tier: P1, account: C, model: huatuo7b, groups: [slake_en], methods: [full, text_only, random_l2, fastv]}
    # HuatuoGPT port validation (task T5, 2026-11-03): run with --limit 50; E8 starts only if it passes

  # Stage 4 — E1: kill test
  - {exp: E1, tier: P0, account: A, model: lingshu7b, groups: [K],
     methods: [full, text_only, random_l2, random_l0, fastv, fastv_prellm, gate_fastv]}

  # Stage 4b — E1g: can a coverage-preserving selector inside the gate beat Random? (added 2026-11-03: FastV keeps
  # 38 distinct keep-sets over 1,000 RadImageNet images, so a gated top-k inherits its positional collapse)
  - {exp: E1g, tier: P0, account: A, model: lingshu7b, groups: [K], methods: [gate_uniform, gate_random, uniform_l2]}
  - {exp: E1g, tier: P0, account: B, model: qwen3vl8b, groups: [K], methods: [gate_uniform, gate_random, uniform_l2]}

  # Stage 5 — E6 (P0, pulled forward 2026-11-03 after E1g made the paper diagnosis-first): mechanism controls on K,
  # scheduled before the grid (launch with EXP="E6,E3"; runs follow block order). Position: static_map (cross-dataset
  # layer-1 rank map), ropefree, fastv_k8/k16. Background: inverse_gate. Coverage: divprune +- gate. Sinks:
  # artifact_excl. Random seeds 1-2 give selector-seed variance for the headline cells.
  - {exp: E6, tier: P0, account: A, model: lingshu7b, groups: [K],
     methods: [static_map, inverse_gate, divprune, gate_divprune, ropefree, gate_ropefree, fastv_k8, fastv_k16,
               artifact_excl]}
  - {exp: E6, tier: P0, account: A, model: lingshu7b, groups: [K], methods: [random_l2], seeds: [1, 2]}
  - {exp: E6, tier: P0, account: B, model: qwen3vl8b, groups: [K],
     methods: [static_map, inverse_gate, divprune, gate_divprune, ropefree, gate_ropefree, fastv_k8, fastv_k16,
               artifact_excl]}
  - {exp: E6, tier: P0, account: B, model: qwen3vl8b, groups: [K], methods: [random_l2], seeds: [1, 2]}

  # Session-2 order (2026-11-03 night): the confound controls and E12 come before the rest of the grid; runs follow
  # block order, and the Chinese split (E3 S2) moved to the end as the lowest priority.
  # E10 / E10r — resolution control (added 2026-11-03). RadImageNet (224², 64 tokens) shows the largest loss, so token
  # count is confounded with domain. Same questions at another resolution (`python -m medprune.data resize`): SLAKE and
  # natural images down to 224² (C, no RadImageNet needed), RadImageNet up to 448² (A/B: needs the HF token).
  - {exp: E10, tier: P0, account: C, model: lingshu7b, groups: [slake_en_s224],
     methods: [full, random_l2, uniform_l2, fastv, gate_fastv, gate_uniform]}
  - {exp: E10, tier: P0, account: C, model: lingshu7b, groups: [natural_s224], methods: [full, random_l2, uniform_l2, fastv]}
  - {exp: E10, tier: P0, account: C, model: qwen3vl8b, groups: [slake_en_s224],
     methods: [full, random_l2, uniform_l2, fastv, gate_fastv, gate_uniform]}
  - {exp: E10, tier: P0, account: C, model: qwen3vl8b, groups: [natural_s224], methods: [full, random_l2, uniform_l2, fastv]}
  - {exp: E10r, tier: P0, account: A, model: lingshu7b, groups: [rin_anat_mc_s448],
     methods: [full, random_l2, uniform_l2, fastv, gate_fastv, gate_uniform]}
  - {exp: E10r, tier: P0, account: B, model: qwen3vl8b, groups: [rin_anat_mc_s448],
     methods: [full, random_l2, uniform_l2, fastv, gate_fastv, gate_uniform]}

  # E11 / E11r — content or position, and does attention rank informative tokens first? (added 2026-11-03 after the
  # offline diagnostics: FastV's keep-set is 98% the same across questions of one image, and random keep-sets holding
  # high-attention tokens are answered less often). fastv_bottom keeps the least-attended tokens; *_vflip shows the
  # same images upside down — a keep-set that stays in place is positional. `python -m medprune.data vflip`.
  - {exp: E11, tier: P0, account: C, model: lingshu7b, groups: [slake_en], methods: [fastv_bottom]}
  - {exp: E11, tier: P0, account: C, model: lingshu7b, groups: [slake_en_vflip], methods: [full, random_l2, fastv]}
  - {exp: E11, tier: P0, account: C, model: qwen3vl8b, groups: [slake_en], methods: [fastv_bottom]}
  - {exp: E11, tier: P0, account: C, model: qwen3vl8b, groups: [slake_en_vflip], methods: [full, random_l2, fastv]}
  - {exp: E11r, tier: P0, account: A, model: lingshu7b, groups: [rin_anat_mc], methods: [fastv_bottom]}
  - {exp: E11r, tier: P0, account: A, model: lingshu7b, groups: [rin_anat_mc_vflip], methods: [full, random_l2, fastv]}
  - {exp: E11r, tier: P0, account: B, model: qwen3vl8b, groups: [rin_anat_mc], methods: [fastv_bottom]}
  - {exp: E11r, tier: P0, account: B, model: qwen3vl8b, groups: [rin_anat_mc_vflip], methods: [full, random_l2, fastv]}

  # E12 — layer profile and text readout (plan.md §A10 D1, D2; added 2026-11-03 night). `full_profile` re-runs Full
  # (same answers) and logs, at every LLM layer, the last-token and text-token log-attention over the visual tokens
  # and visual-sink scores; `fastv_text` prunes with the text-token readout (FastV paper's wording, G2).
  - {exp: E12, tier: P0, account: A, model: lingshu7b, groups: [K, N], methods: [full_profile]}
  - {exp: E12, tier: P0, account: A, model: lingshu7b, groups: [K], methods: [fastv_text]}
  - {exp: E12, tier: P0, account: B, model: qwen3vl8b, groups: [K, N], methods: [full_profile]}
  - {exp: E12, tier: P0, account: B, model: qwen3vl8b, groups: [K], methods: [fastv_text]}

  # Stage 5 — E3: main grid at 10% (S3 before S2: a third benchmark matters more than the Chinese split)
  - {exp: E3, tier: P0, account: A, model: lingshu7b, groups: [S1],
     methods: [full, text_only, uniform_l2, fastv, ropefree, gate_fastv, gate_ropefree, gate_uniform]}
  - {exp: E3, tier: P0, account: A, model: lingshu7b, groups: [S1], methods: [random_l2], seeds: [0, 1, 2]}
  - {exp: E3, tier: P0, account: A, model: lingshu7b, groups: [S3],
     methods: [full, text_only, random_l2, uniform_l2, fastv, ropefree, gate_fastv, gate_uniform]}
  - {exp: E3, tier: P0, account: B, model: qwen3vl8b, groups: [S1],
     methods: [full, text_only, uniform_l2, fastv, ropefree, gate_fastv, gate_ropefree, gate_uniform]}
  - {exp: E3, tier: P0, account: B, model: qwen3vl8b, groups: [S1], methods: [random_l2], seeds: [0, 1, 2]}
  - {exp: E3, tier: P0, account: B, model: qwen3vl8b, groups: [S3],
     methods: [full, text_only, random_l2, uniform_l2, fastv, ropefree, gate_fastv, gate_uniform]}

  # Stage 5 — E4: modality panel
  - {exp: E4, tier: P0, account: A, model: lingshu7b, groups: [P],
     methods: [full, text_only, random_l2, fastv, gate_fastv, gate_uniform]}
  - {exp: E4, tier: P0, account: B, model: qwen3vl8b, groups: [P],
     methods: [full, text_only, random_l2, fastv, gate_fastv, gate_uniform]}

  # Stage 6 — E5: budget curves
  - {exp: E5, tier: P1, account: A, model: lingshu7b, groups: [K],
     methods: [random_l2, fastv, gate_fastv, gate_uniform], budgets: [0.05, 0.25]}
  - {exp: E5, tier: P1, account: A, model: lingshu7b, groups: [K], methods: [fastv, gate_fastv], budgets: [0.50]}
  - {exp: E5, tier: P1, account: B, model: qwen3vl8b, groups: [K], methods: [random_l2, fastv, gate_fastv],
     budgets: [0.05, 0.25]}

  # Stage 5 — E3 S2 (SLAKE-zh), last: the lowest-priority cell of the grid
  - {exp: E3, tier: P0, account: A, model: lingshu7b, groups: [S2], methods: [full, text_only, random_l2, fastv, gate_fastv]}
  - {exp: E3, tier: P0, account: B, model: qwen3vl8b, groups: [S2], methods: [full, text_only, random_l2, fastv, gate_fastv]}

  # Stage 6 — E6 (P1): mechanism controls
  - {exp: E6, tier: P1, account: A, model: lingshu7b, groups: [S1],
     methods: [fastv_k8, fastv_k16, static_map, inverse_gate, divprune, gate_divprune]}
  - {exp: E6, tier: P1, account: A, model: lingshu7b, groups: [slake_en], methods: [oracle_gate]}
  - {exp: E6, tier: P1, account: B, model: qwen3vl8b, groups: [K],
     methods: [fastv_k16, static_map, inverse_gate, divprune, gate_divprune]}

  # Stage 6 — E7: natural-image control (no gate). Moved to C (2026-11-03): it decides the "medical-specific" claim.
  - {exp: E7, tier: P0, account: C, model: lingshu7b, groups: [N], methods: [full, random_l2, uniform_l2, fastv, ropefree]}
  - {exp: E7, tier: P0, account: C, model: qwen3vl8b, groups: [N], methods: [full, random_l2, uniform_l2, fastv, ropefree]}

  # Stage 7 — E6 (P2): gate robustness, artifacts, PDrop
  - {exp: E6, tier: P2, account: C, model: lingshu7b, groups: [S1],
     methods: [artifact_excl, gate_quota3, gate_tau25, gate_tau75, pdrop, gate_pdrop]}

  # Stage 7 — E8: HuatuoGPT-Vision-7B (LLaVA-1.5, 1D RoPE, always 576 tokens: RadImageNet's 224² images get 9x the
  # Qwen models' 64 tokens, so it doubles as a model-level token-count contrast for G1). K first (G6), then the rest.
  # Split Nov 3 (port validated, E0 50/50 checks): E8 = SLAKE (no token needed); E8r = RadImageNet, which needs the
  # `cvpr` secret attached to C's notebook.
  - {exp: E8, tier: P1, account: C, model: huatuo7b, groups: [slake_en],
     methods: [full, text_only, random_l2, uniform_l2, fastv, gate_fastv]}
  - {exp: E8, tier: P2, account: C, model: huatuo7b, groups: [slake_en],
     methods: [full_profile, fastv_text, ropefree, gate_ropefree, fastv_bottom]}  # profile: the 1D-RoPE case (G18)
  - {exp: E8r, tier: P1, account: C, model: huatuo7b, groups: [rin_anat_mc],
     methods: [full, text_only, random_l2, uniform_l2, fastv, gate_fastv]}
  - {exp: E8r, tier: P2, account: C, model: huatuo7b, groups: [rin_anat_mc],
     methods: [full_profile, fastv_text, ropefree, gate_ropefree, fastv_bottom]}
  - {exp: E8r, tier: P2, account: C, model: huatuo7b, groups: [rin_abn_closed],
     methods: [full, text_only, random_l2, fastv, gate_fastv]}

  # Stage 6 — E13: published training-free pruners on the main grid (added 2026-11-04). Official selection code,
  # medprune prompts and scoring (medprune/baselines/): text-guided attention inside the LLM (SparseVLM), vision-tower
  # attention + diversity (VisPruner), semantic groups + NMS (PruneSID), balanced attention/diversity stages (BTP).
  # 10% kept; multi-stage methods token-matched to FastV. Second Kaggle slot of A and B (notebooks
  # medprune-baselines-<model>), in parallel with session 2. Pre-LLM methods first (cheapest), SparseVLM last.
  - {exp: E13, tier: P0, account: A, model: lingshu7b, groups: [S1, S3], methods: [prunesid, vispruner, btp, sparsevlm]}
  - {exp: E13, tier: P0, account: B, model: qwen3vl8b, groups: [S1, S3], methods: [prunesid, vispruner, btp, sparsevlm]}
  # DivPrune ± gate on the baseline-table cells E6 did not cover (added 2026-11-05), so DivPrune has every cell:
  # OmniMedVQA anatomy for both models, RadImageNet abnormality for Qwen3-VL (Lingshu's is in E6, account A).
  # Lingshu on C, Qwen3-VL on B.
  - {exp: E13, tier: P1, account: C, model: lingshu7b, groups: [S3], methods: [divprune, gate_divprune]}
  - {exp: E13, tier: P1, account: B, model: qwen3vl8b, groups: [rin_abn_closed, S3], methods: [divprune, gate_divprune]}

  # Nov 7 — E14 (G19): published pruners that do not read early-layer LLM attention, or fix it — vision-encoder attention
  # (VisionZip, HiPrune), instruction-conditioned diversity before the LLM (CDPruner), RoPE-free + uniform early stage
  # (FEATHER), encoder scans + mid-layer pruning (VScan), token transition + instruction attention (TransPrune); the
  # gate composed with VisionZip and CDPruner. Account D (4th account, new notebooks without the `cvpr` secret) runs
  # SLAKE and OmniMedVQA; account B (notebooks with the secret) runs the RadImageNet cells.
  - {exp: E14, tier: P0, account: D, model: lingshu7b, groups: [slake_en, S3],
     methods: [feather, cdpruner, hiprune, visionzip, vscan, transprune, gate_cdpruner, gate_visionzip]}
  - {exp: E14, tier: P0, account: D, model: qwen3vl8b, groups: [slake_en, S3],
     methods: [feather, cdpruner, hiprune, visionzip, vscan, transprune, gate_cdpruner, gate_visionzip]}
  - {exp: E14, tier: P0, account: B, model: lingshu7b, groups: [rin_anat_mc, rin_abn_closed],
     methods: [feather, cdpruner, hiprune, visionzip, vscan, transprune, gate_cdpruner, gate_visionzip]}
  - {exp: E14, tier: P0, account: B, model: qwen3vl8b, groups: [rin_anat_mc, rin_abn_closed],
     methods: [feather, cdpruner, hiprune, visionzip, vscan, transprune, gate_cdpruner, gate_visionzip]}

  # Nov 7 — E15 (§A10 D5): RadImageNet open questions (500 anatomy + 500 pathology, judge-scored in the same session:
  # the license forbids moving RadImageNet text off the session). Lingshu only (account C, 2.8 h left).
  - {exp: E15, tier: P0, account: C, model: lingshu7b, groups: [rin_open],
     methods: [full, text_only, random_l2, fastv, gate_fastv, gate_uniform, uniform_l2, prunesid]}
  - {exp: E15, tier: P1, account: C, model: lingshu7b, groups: [rin_open], methods: [random_l2], seeds: [1, 2]}

  # Nov 7 — E16 (D-15): why SparseVLM survives on Qwen3-VL where FastV collapses. Its text raters with one FastV-style
  # stage at 10%, at FastV's layer (raters vs last token, same schedule as `fastv` / `fastv_text`) and at SparseVLM's
  # first-stage layer (one stage vs its three). Account A (University), Qwen3-VL first.
  - {exp: E16, tier: P0, account: A, model: qwen3vl8b, groups: [rin_anat_mc, slake_en], methods: [fastv_raters, sparsevlm_single]}
  - {exp: E16, tier: P0, account: A, model: lingshu7b, groups: [rin_anat_mc], methods: [fastv_raters, sparsevlm_single]}

  # Nov 7 — E17: where along the first layers is the FastV ranking broken? FastV scored at layers 2-5 (K = 3-6) on RIN
  # anatomy, both models, plus Lingshu's `sparsevlm_single` (did not fit A v10). The E12 profile's per-layer position
  # share is the prediction (plan.md E14-E16 card, P24-P25). Account A after the weekly reset.
  - {exp: E17, tier: P0, account: A, model: qwen3vl8b, groups: [rin_anat_mc], methods: [fastv_k3, fastv_k4, fastv_k5, fastv_k6]}
  - {exp: E17, tier: P0, account: A, model: lingshu7b, groups: [rin_anat_mc],
     methods: [fastv_k3, fastv_k4, fastv_k5, fastv_k6, sparsevlm_single]}

  # Nov 7 — E15b: RadImageNet open questions for Qwen3-VL (E15's second model, after the weekly reset), judged in-session.
  - {exp: E15b, tier: P0, account: A, model: qwen3vl8b, groups: [rin_open],
     methods: [full, text_only, random_l2, fastv, gate_fastv, gate_uniform, uniform_l2, prunesid]}
  - {exp: E15b, tier: P1, account: A, model: qwen3vl8b, groups: [rin_open], methods: [random_l2], seeds: [1, 2]}
